<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advocate Of Shalom Dashboard</title>
    <script>
      // Set the theme BEFORE Vue mounts to avoid a flash of light mode.
      // Priority: localStorage → OS preference → light.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { /* localStorage blocked in some contexts; safe to skip */ }
      })();
    </script>
    <script async defer src="https://scripts.simpleanalyticscdn.com/latest.js" data-hostname="sa.advocateofshalom.com"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
      <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif" alt="" referrerpolicy="no-referrer-when-downgrade" /></noscript>
  </body>
</html>
